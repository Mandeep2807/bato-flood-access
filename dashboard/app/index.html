<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BATO · Satellite disaster intelligence</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='8' height='16' fill='%233cc4ae'/%3E%3Crect x='8' width='8' height='16' fill='%233a2a10'/%3E%3Cpath d='M8 4l4-4M8 8l8-8M8 12l8-8M8 16l8-8M12 16l4-4' stroke='%23e2a33a' stroke-width='1.3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="css/bato.css">
</head>
<body>
<div class="loading" id="loading"><div class="in"><span class="mark"><i></i><i></i></span><span class="micro">Loading the official result</span></div></div>

<div class="app" id="app">
  <aside class="rail" aria-label="Sections">
    <div class="brand" title="BATO"><span class="mark" aria-hidden="true"><i></i><i></i></span></div>
    <nav id="rail"></nav>
    <button class="tab judge-tab" id="judgeTab" aria-pressed="false" title="Judge mode (J)">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Judge</button>
  </aside>

  <header class="top">
    <div class="wordmark"><b>BATO</b><span>Satellite disaster intelligence</span></div>
    <div class="incident" id="incident"></div>
    <span class="badge-nv" title="This analysis result is rule-based on provisional thresholds and has not been validated against a reference map. See Incident and Methodology.">Preliminary • rule-based</span>
    <div class="spacer"></div>
    <div class="timeline" id="timeline" aria-label="Acquisition timeline"></div>
    <button class="follow" id="followBtn"><span class="dot"></span>Follow the evidence</button>
  </header>

  <main class="stage" id="stage">
    <div id="map" role="region" aria-label="Map"></div>
    <section class="status" id="status" aria-label="Incident status"></section>
    <section class="panel" id="panel" aria-live="polite">
      <header><h2 id="panelTitle"></h2>
        <button class="x-btn" id="panelClose" aria-label="Close panel"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg></button></header>
      <div class="body" id="panelBody"></div>
    </section>
    <aside class="drawer" id="drawer" hidden aria-live="polite">
      <header id="drawerHead"></header>
      <div class="body" id="drawerBody"></div>
    </aside>
    <div class="mode-banner" id="modeBanner" hidden></div>
    <div class="mapctl" id="mapctl"></div>
    <div class="hover-tag" id="hoverTag" hidden></div>
    <div class="follow-track" id="followTrack" hidden></div>
    <div class="finale" id="finale" hidden></div>
    <div class="judge" id="judge" hidden></div>
  </main>
</div>

<script src="vendor/maplibre/maplibre-gl.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
